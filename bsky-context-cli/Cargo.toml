[package]
name = "bsky-context-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line crawler and viewer for Bluesky conversation graphs"

[[bin]]
name = "bsky-context"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bsky-context-core = { path = "../bsky-context-core" }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
jiff = "0.2"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
