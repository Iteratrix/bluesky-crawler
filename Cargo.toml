[workspace]
resolver = "2"
members = [
    "bsky-context-core",
    "bsky-context-cli",
    "bsky-context-web",
    "bsky-context-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Iteratrix/bluesky-crawler"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
