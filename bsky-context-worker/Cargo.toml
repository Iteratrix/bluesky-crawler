[package]
name = "bsky-context-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cloudflare Worker serving Bluesky context webs as text for language models"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
az = "1"
bsky-context-core = { path = "../bsky-context-core" }
console_error_panic_hook = "0.1"
futures = "0.3"
js-sys = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worker = "0.8"

[lints]
workspace = true
