name = "bsky-context"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-01"
workers_dev = true

[build]
command = "cargo install -q worker-build && worker-build --release"

# Per-request crawl budget. A language model's URL fetcher times out in
# tens of seconds, so keep the timeout well under that; repeated fetches of
# the same URL continue from the cached web.
[vars]
CRAWL_MAX_NODES = "500"
CRAWL_TIMEOUT_SECS = "20"
CRAWL_CONCURRENCY = "4"

# Optional: cache crawled webs so a second fetch continues where the first
# stopped. Create with `wrangler kv namespace create WEBS` and paste the id.
# [[kv_namespaces]]
# binding = "WEBS"
# id = ""
